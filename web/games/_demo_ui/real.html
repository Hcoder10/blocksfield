<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>ThreeKit UI on real kits</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js",
 "three/addons/":"../../vendor/three/addons/","kit":"../../kit/index.js"}}</script>
</head><body><script type="module">
// UI/FX/Audio/Debug on the real Look/Level/Player/Gameplay kits. ?kind=sky_islands|race_track|...&look=...&style=...&title=0
import * as K from 'kit';
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'sky_islands', race = /race|track/.test(kind);
const game = await K.createGame({ seed: 7 });
K.Look.apply(game, q.get('look') || 'toon_bright');
const level = K.Level.build(game, kind, { size: 'medium', collectibles: 30 });
const player = K.Player.create(game, { type: race ? 'kart' : 'platformer', spawn: level.spawn, yaw: level.spawnYaw });
race ? K.Camera.chase(game, player) : K.Camera.follow(game, player);
K.Gameplay.rules(game, race ? { level, player, race: { laps: 3, opponents: 5 }, timer: true } : { level, player, collect: { tag: 'coin', target: 20 }, goal: true, lives: 3 });
K.UI.hud(game, race ? { style: q.get('style') || undefined, lap: true, position: true, timer: true, speedometer: true, minimap: true }
  : { style: q.get('style') || undefined, counters: [{ id: 'coins', icon: 'coin', label: 'Coins' }], timer: true, lives: true, minimap: true });
if (q.get('title') !== '0') K.UI.titleScreen(game, { title: race ? 'Turbo Tides' : 'Starbloom Peaks', subtitle: race ? 'Three laps, no brakes' : 'Collect 20 coins, then reach the goal', controls: 'WASD / arrows: move · Space: jump', countdown: race });
K.FX.auto(game, { player });
K.Audio.auto(game);
K.Debug.install(game, { level, player });
game.start();
</script></body></html>
